                        <p>应参加西南财经大学中国行为经济与行为金融研究中心邀请，9月25日上午叶茂亮副教授参加该中心的学术工作坊并担任点评专家，听取中心研究人员的相关研究并提供意见。此次受邀担任点评专家的均为国内外知名的青年行为实验经济学者。</p>
